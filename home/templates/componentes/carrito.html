{% load static %}
<div class="carrito-compras">
    <img src="{% static 'img/carritoBlanco.png' %}" alt="Carrito de compas" id="imagen-carrito" width="30px" height="30px">
    <span class="contador-carrito" id="contador_carrito">0</span>

    <div class="modal-carrito">
        <h2>Carrito de Compras</h2>
        <div class="productos_carrito" id="productos_carrito">
            <div class="tabla_carrito">
                {% if not productos_carrito%}
                <div class="thead">
                    <div class="fila_carrito">
                        <span>Producto</span>
                        <span>Cantidad</span>
                        <span>Precio</span>
                        <span>Subtotal</span>
                        <span>Acciones</span>
                    </div>
                </div>
                {% endif %}
                <div class="tbody" id="tbody_carrito">
                    {% if not productos_carrito %}
                        <span class="sin_productos">No tienes poductos por comprar</span>
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="total-carrito">
            <span id="total_carrito">Total: </span>
        </div>
        <div class="btns-carrito">
            <button class="btn-carrito btn-cancelar" id="btn_limpiar_carrito" onclick="limpiarCarrito();">Limpiar</button>
            <button class="btn-carrito btn-comprar" id="btn_comprar_carrito">Comprar</button>
        </div>
    </div>
</div>
